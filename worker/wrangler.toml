name = "insta-lock-in"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Namespace "insta-lock-in-LOCK_KV", created 2026-09-27.
[[kv_namespaces]]
binding = "LOCK_KV"
id = "81eb575709fc4ea9b56b9aa702efd710"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put TOKEN        < ../.secrets/token
#   npx wrangler secret put BARK_KEY     < ../.secrets/bark_key

# Cron: every minute, relock at the cap and send nags through Bark.
[triggers]
crons = ["* * * * *"]

[vars]
POST_CAP_MIN = "30"
POST_NAG_MIN = "10"
POST_REQUIRED = "view,like,comment"
STORY_CAP_MIN = "10"
STORY_NAG_MIN = "5"
STORY_REQUIRED = "watched"
DM_CAP_MIN = "10"
DM_NAG_MIN = "5"
DM_REQUIRED = "watched,replied"
# Public base URL, used for the checklist link inside pushes.
WORKER_URL = "https://insta-lock-in.rayancaszou.workers.dev"
